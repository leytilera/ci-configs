clone:
    plugin: git
    settings:
        depth: 0
        tags: true
steps:
    - name: build
      image: adoptopenjdk/openjdk8
      commands:
          - chmod +x mpt
          - ./mpt buildtwitch
          - ./mpt buildtechnic
      when:
        - event: manual
        - event: tag
    - name: generate-changelog
      image: ghcr.io/orhun/git-cliff:latest
      commands:
          - git-cliff --output CHANGELOG.md -l --verbose
      when:
        - event: manual
        - event: tag
    - name: publish
      image: plugins/gitea-release
      settings:
          base_url: https://git.tilera.org
          api_key:
              from_secret: gitea_token
          note: CHANGELOG.md
          title: ${CI_COMMIT_TAG}
          files:
              - build/*
      when:
          event: tag
      depends_on:
          - build
          - generate-changelog